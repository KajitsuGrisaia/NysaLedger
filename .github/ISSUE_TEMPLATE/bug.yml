name: Reportar un error
description: Un problema reproducible usando datos ficticios
title: "[Error] "
body:
  - type: markdown
    attributes:
      value: "No adjuntes XML reales, respaldos, firmas ni datos personales. Para vulnerabilidades consulta SECURITY.md."
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Usa la demo o un ejemplo ficticio.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado y resultado observado
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Navegador, dispositivo y versión de NysaLedger
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: Este reporte no contiene documentos reales, credenciales ni datos personales.
          required: true
